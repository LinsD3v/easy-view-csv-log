<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosadora CSV - Visualizador</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">📊 Dosadora CSV</h1>
                <p class="subtitle">Visualizador e Buscador de Produtos</p>
            </div>
        </header>
        

        <!-- Status Badge -->
        <div id="status-badge" class="status-badge"></div>

        <!-- Upload Section -->
        <div id="upload-section" class="upload-section">
            <div class="upload-card">
                <div class="upload-icon">📁</div>
                <h2>Enviar arquivo CSV</h2>
                <p class="upload-description">Selecione ou arraste o arquivo CSV para começar</p>
                
                <div class="upload-box" id="upload-box">
                    <input type="file" id="csv-file" accept=".csv" hidden>
                    <p>Clique para selecionar ou arraste aqui</p>
                </div>
                
                <button onclick="uploadCsv()" class="btn btn-primary">
                    📤 Upload
                </button>
            </div>
        </div>

        <!-- Info Section -->
        <div id="info-section" class="info-section" style="display: none;">
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-icon">📈</div>
                    <div class="info-content">
                        <span class="info-label">Total de Linhas</span>
                        <span class="info-value" id="info-rows">-</span>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon">🏭</div>
                    <div class="info-content">
                        <span class="info-label">Máquina</span>
                        <span class="info-value" id="info-machine">-</span>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon">⏰</div>
                    <div class="info-content">
                        <span class="info-label">Carregado em</span>
                        <span class="info-value" id="info-time">-</span>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-icon">📋</div>
                    <div class="info-content">
                        <span class="info-label">Colunas</span>
                        <span class="info-value" id="info-columns">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Section -->
        <div id="search-section" class="search-section" style="display: none;">
            <div class="search-card">
                <h2>🔍 Buscar Produto</h2>
                <div class="search-box">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Digite o nome do produto..."
                        class="search-input"
                    >
                    <button onclick="searchProduct()" class="btn btn-search">
                        Buscar
                    </button>
                </div>
                
                <div id="results" class="results-container"></div>
            </div>
        </div>

        <!-- Clear Button -->
        <div id="clear-section" class="clear-section" style="display: none;">
            <button onclick="clearData()" class="btn btn-secondary">
                🗑️ Limpar Dados
            </button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
